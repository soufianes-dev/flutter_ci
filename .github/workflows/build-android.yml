name: Build Android
on:
  # push:
  #   branches:
  #     - main
  # Enable manual run through GitHub UI
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to execute"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - closed
          - open
          - production
          - firebase # Distribute to Firebase App Distribution
          - promote_internal_to_closed
          - promote_closed_to_open
          - promote_open_to_production
          - promote_closed_to_production
env:
  FLUTTER_VERSION: "3.47.6"
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  RUBY_VERSION: "3.3"
  WORKING_DIR: "android"
  ANDROID_PACKAGE_NAME: "dev.soufianes.flutterci"

jobs:
  build-android:
    name: Build and Deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: "gradle"
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      # NOTE: Convert key.properties to base64: `base64 -w 0 android/app/upload-keystore.jks`
      # and add it to github secrets
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d -i > android/app/upload-keystore.jks
      - name: Configure signing
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_STORE_PASSWORD}
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      # Setup Ruby, Bundler, and Gemfile dependencies
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIR }}
      # TODO:
      - name: Build with Fastlane
        env:
          APP_NAME: ${{ env.APP_NAME }}
          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          BUILD_TYPE: "debug"
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          BUILD_HOST: ${{ runner.name }}
        run: |
          bundle exec fastlane build_all_android_artifacts

          # Validate flutter-ci-432e4-b2e456c83eaa.json
          # fastlane run validate_play_store_json_key json_key:flutter-ci-432e4-b2e456c83eaa.json
          # TODO: Publish
          # bundle exec fastlane ${{ github.event.inputs.lane || 'internal' }}

        working-directory: ${{ env.WORKING_DIR }}
      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-abbs
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 90
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
      - name: Upload Android build manifest
        uses: actions/upload-artifact@v7
        with:
          path: android_build_manifest.json
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: native-debug-symbols
          path: build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/
          retention-days: 90
      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
