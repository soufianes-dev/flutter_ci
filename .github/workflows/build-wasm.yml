name: Build WASM
on:
  # push:
  #   branches:
  #     - main
  # Enable manual run through GitHub UI
  workflow_dispatch:
env:
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_CHANNEL: "stable"
jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "PREFIX=${APP_NAME}-v${VERSION}-build.${BUILD}-wasm" >> "$GITHUB_ENV"
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}          
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings
      # - name: Run tests
      #   run: flutter test
      - name: Build Web with WASM
        run: |
          lockfilePath="pubspec.yaml"
          lockHash=""
          if [ -f "$lockfilePath" ]; then
            # Compute SHA256 and take first 12 characters
            lockHash=$(sha256sum "$lockfilePath" | awk '{print substr($1,1,12)}')
          else
            lockHash="no-lockfile"
          fi

          buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          gitCommitSha=$(git rev-parse HEAD)
          gitBranchName=${{ github.ref_name }}

          flutterVersionOutput=$(flutter --version --machine)
          flutterFwVersion=$(echo "$flutterVersionOutput" | jq -r '.frameworkVersion')
          flutterChannel=$(echo "$flutterVersionOutput" | jq -r '.channel')
          flutterVersionStr="Flutter $flutterFwVersion ($flutterChannel)"

          dartVersionStr=$(dart --version 2>&1 | head -n 1)

          flutter build web \
            --wasm \
            --release \
            --dart-define="BUILD_NAME=${{ env.BUILD_NAME }}" \
            --dart-define="BUILD_NUMBER=${{ env.BUILD_NUMBER }}" \
            --dart-define="COMPILER_VERSION=$flutterVersionStr" \
            --dart-define="DART_VERSION=$dartVersionStr" \
            --dart-define="DEPENDENCY_LOCK_HASH=$lockHash" \
            --dart-define="BUILD_TIMESTAMP=$buildTimestamp" \
            --dart-define="GIT_SHA=$gitCommitSha" \
            --dart-define="GIT_BRANCH=$gitBranchName" \
            --dart-define="CI_PIPELINE_ID=${{ github.run_id }}" \
            --dart-define="BUILD_HOST=${{ runner.name }}" \
            --dart-define="OS_TARGET=${{ runner.os }}" \
            --dart-define="BUILD_TYPE=release" \
            --dart-define="BUILD_FLAVOR=production" \
            --build-name=${{ env.BUILD_NAME }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --source-maps \
            --enable-wasm-deferred-loading \
            --tree-shake-icons \
            --base-href / \
            --target lib/main.dart
      - name: Verify WASM output
        run: |
          set -euo pipefail

          required_files=(
            "build/web/index.html"
            "build/web/flutter_bootstrap.js"
            "build/web/main.dart.wasm"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required WASM output not found: $file"
              exit 1
            fi
          done

          if [[ ! -d "build/web/assets" ]]; then
            echo "::error::Flutter web assets directory not found"
            exit 1
          fi

          echo "WASM build verification passed."
      - name: Package Web
        run: |
          set -euo pipefail

          cd build/web
          zip -r "../../${{ env.PREFIX }}.zip" .
      - name: Upload web WASM
        uses: actions/upload-artifact@v7
        with:
          path: "${{ env.PREFIX }}.zip"
          archive: false
          if-no-files-found: error
          retention-days: 30
