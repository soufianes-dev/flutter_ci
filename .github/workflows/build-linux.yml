name: Build Linux

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_PUBLISHER: "Soufiane Saadouni"
  PACKAGE_NAME: "flutter-ci"
  FLUTTER_VERSION: "3.47.4"
  FLUTTER_CHANNEL: "stable"
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate required assets
        run: |
          set -euo pipefail
          test -f assets/logo.png || {
            echo "::error::assets/logo.png is required for AppImage"
            exit 1
          }

          test -f assets/logo256.png || {
            echo "::error::assets/logo256.png is required for Linux package icons"
            exit 1
          }

  build-debian-and-appimage:
    name: Debian + AppImage (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false # One arch failing should not cancel the other
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            flutter_arch: x64
            deb_arch: amd64
            appimagetool: appimagetool-x86_64.AppImage
            # https://github.com/AppImage/appimagetool/releases/tag/1.9.1
            appimagetool_sha256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

          # TODO: Uncomment when Flutter support arm64 on Linux
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm # native ARM runner
          #   flutter_arch: arm64
          #   deb_arch: arm64
          #   appimagetool: appimagetool-aarch64.AppImage
          #   # https://github.com/AppImage/appimagetool/releases/tag/1.9.1
          #   appimagetool_sha256: "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            appstream zip wget

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-preflight-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-preflight-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Create .env
        run: |
          printf 'ENV_VAR1=%s\n' \
            "${{ secrets.ENV_VAR1 }}" > .env

          chmod 600 .env

      # - name: Run tests
      #   run: flutter test

      - name: Build Linux (release)
        run: |
          flutter build linux \
            --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=symbols/linux \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --target lib/main.dart

      - name: Package debug symbols
        run: |
          set -euo pipefail

          SYMBOLS_DIR="symbols/linux"

          if [[ ! -d "$SYMBOLS_DIR" ]]; then
            echo "No debug symbols generated"
            exit 0
          fi

          SYMBOLS_ARCHIVE="${{ env.PACKAGE_NAME }}-v${{ env.APP_VERSION }}-linux-${{ matrix.arch }}-symbols.tar.gz"

          tar \
            -czf "$SYMBOLS_ARCHIVE" \
            -C "$SYMBOLS_DIR" \
            .

          echo "SYMBOLS_ARCHIVE=$SYMBOLS_ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: linux-debug-symbols-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: ${{ env.SYMBOLS_ARCHIVE }}
          if-no-files-found: ignore # To silently skip
          retention-days: 14

      - name: Package Linux
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ matrix.flutter_arch }}"
          SOURCE="build/linux/${ARCH}/release/bundle"
          DEST="${PACKAGE_NAME}-v${VERSION}-linux-${ARCH}.tar.gz"

          if [ ! -d "$SOURCE" ]; then exit 1; fi

          # Build linux tarball
          tar -czf "$DEST" -C "$SOURCE" .

          LINUX_PACKAGE="$DEST"
          echo "LINUX_PACKAGE=$LINUX_PACKAGE" >> "$GITHUB_ENV"

      - name: Install appimagetool
        env:
          APPIMAGETOOL_FILE: ${{ matrix.appimagetool }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          set -euo pipefail

          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/${APPIMAGETOOL_FILE}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$APPIMAGETOOL_FILE" \
            "$APPIMAGETOOL_URL"

          echo "${APPIMAGETOOL_SHA256} ${APPIMAGETOOL_FILE}" | sha256sum --check

          chmod +x "$APPIMAGETOOL_FILE"

          sudo mv "$APPIMAGETOOL_FILE" /usr/local/bin/appimagetool

          appimagetool --version

      - name: Create AppImage
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "::error::Flutter bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          # Create AppDir structure
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # Copy Icon
          cp "assets/logo.png" "$APPDIR/logo.png"
          cp "assets/logo.png" "$APPDIR/.DirIcon"

          # Create AppRun
          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${{ env.APP_NAME }}" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Create desktop entry
          cat > "$APPDIR/${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Version=1.0
          Exec=${{ env.APP_NAME }} %u
          Icon=logo
          Type=Application
          Categories=Utility;
          EOF

          # ARCH is used by appimagetool to select the correct runtime
          export ARCH=${{ matrix.arch }}
          # Build AppImage
          APPIMAGE_NAME="${{ env.PACKAGE_NAME }}-v${{ env.APP_VERSION }}-linux-${{ matrix.arch }}.AppImage"
          appimagetool --no-appstream AppDir "$APPIMAGE_NAME"
          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build Debian package
        run: |
          set -euo pipefail

          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libc6-dev \
            binutils

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          PKG_DIR="${{ env.PACKAGE_NAME }}-v${{ env.APP_VERSION }}-linux-${{ matrix.arch }}"

          # Create package structure
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}"
          mkdir -p "$PKG_DIR/usr/bin"

          mkdir -p "$PKG_DIR/usr/share/applications"

          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy full bundle to usr/lib
          cp -a "$BUNDLE_DIR"/. "$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}/"

          cp \
            "assets/logo256.png" \
            "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          # Symlink binary to usr/bin
          ln -s "/usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }}" \
            "$PKG_DIR/usr/bin/${{ env.APP_NAME }}"

          # Desktop entry
          cat > "$PKG_DIR/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }} %U
          Icon=${{ env.PACKAGE_NAME }}
          Type=Application
          Categories=Utility;
          Terminal=false
          StartupNotify=true
          EOF

          SHLIBS_DIR=".dpkg-shlibdeps"
          trap 'rm -rf "$SHLIBS_DIR"' EXIT
          mkdir -p "$SHLIBS_DIR/debian"

          cat > "$SHLIBS_DIR/debian/control" <<EOF
          Source: ${{ env.PACKAGE_NAME }}
          Package: ${{ env.PACKAGE_NAME }}
          Architecture: ${{ matrix.deb_arch }}
          Description: Flutter Linux application ${{ matrix.arch }}
          EOF

          APP_BINARY="$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }}"

          if [[ ! -x "$APP_BINARY" ]]; then
            echo "::error::Flutter executable not found or is not executable: $APP_BINARY"
            exit 1
          fi

          # Calculate runtime dependencies
          SHLIBS_DEPENDS="$(
            (
              cd "$SHLIBS_DIR"
              dpkg-shlibdeps \
                -O \
                -l"../$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}" \
                -e"../$APP_BINARY"
              ) | sed -n 's/^shlibs:Depends=//p'
          )"

          if [[ -z "$SHLIBS_DEPENDS" ]]; then
            echo "::error::Could not determine Debian shared-library dependencies"
            exit 1
          fi

          echo "Detected runtime dependencies:"
          echo "$SHLIBS_DEPENDS"

          # Generate binary package metadata
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: ${{ env.PACKAGE_NAME }}
          Version: ${{ env.APP_VERSION }}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: ${{ env.APP_PUBLISHER }} <soufianes.pro@gmail.com>
          Depends: $SHLIBS_DEPENDS
          Description: Flutter Linux application ${{ matrix.arch }}
          Section: utils
          Priority: optional
          EOF

          # Build .deb package
          dpkg-deb --build --root-owner-group "$PKG_DIR"
          echo "DEB_NAME=${PKG_DIR}.deb" >> "$GITHUB_ENV"


          # Validate resulting package
          dpkg-deb --info "${PKG_DIR}.deb"
          dpkg-deb --contents "${PKG_DIR}.deb"

      - name: Smoke-test packages
        run: |
          set -euo pipefail
          file "${{ env.APPIMAGE_NAME }}"

          dpkg-deb -c "${{ env.DEB_NAME }}" | grep -q \
            "usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          dpkg-deb -c "${{ env.DEB_NAME }}" | grep -q \
            "usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          dpkg-deb -I "${{ env.DEB_NAME }}"
          echo "✅ Packages look valid ${{ matrix.arch }}"

      - name: Smoke-test Debian package
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install \
            --yes \
            "./${{ env.DEB_NAME }}"

          command -v "${{ env.APP_NAME }}"
          test -L "/usr/bin/${{ env.APP_NAME }}"
          test -f "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          test -f "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          echo "Debian package installed successfully"

      - name: Smoke-test AppImage
        run: |
          set -euo pipefail

          file "${{ env.APPIMAGE_NAME }}"
          test -x "${{ env.APPIMAGE_NAME }}"
          "./${{ env.APPIMAGE_NAME }}" --appimage-version
          echo "✅ AppImage looks valid"

      - name: Generate checksums
        run: |
          set -euo pipefail

          CHECKSUM_FILE="${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-linux-${{ matrix.arch }}-debian-SHA256SUMS.txt"
          sha256sum \
            "${{ env.LINUX_PACKAGE }}" \
            "${{ env.APPIMAGE_NAME }}" \
            "${{ env.DEB_NAME }}" \
            > "$CHECKSUM_FILE"

          cat "$CHECKSUM_FILE"
          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> "$GITHUB_ENV"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: |
            ${{ env.LINUX_PACKAGE }}
            ${{ env.APPIMAGE_NAME }}
            ${{ env.DEB_NAME }}
            ${{ env.CHECKSUM_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Clean .env
        if: always()
        run: rm -f .env

  build-fedora:
    name: Fedora RPM (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            flutter_arch: x64
            rpm_arch: x86_64

          # TODO
          # - arch: aarch64
          #   runner: ubuntu-24.04-arm
          #   flutter_arch: arm64
          #   rpm_arch: aarch64

    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            clang cmake ninja-build pkg-config gtk3-devel \
            gcc-c++ glib2-devel libcurl-devel openssl-devel libsecret-devel \
            libblkid-devel jsoncpp-devel libstdc++-devel libstdc++-static \
            wget unzip tar rpm-build git jq which

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.arch }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          printf 'ENV_VAR1=%s\n' \
            "${{ secrets.ENV_VAR1 }}" > .env

          chmod 600 .env

      - name: Build Linux  (release)
        run: |
          # Workaround for Flutter bug: CMake install fails when
          # build/native_assets/linux does not exist (no native assets).
          # See https://github.com/flutter/flutter/issues/159199#issue-2675961578
          mkdir -p build/native_assets/linux

          flutter build linux \
            --release \
            --dart-define-from-file=.env \
            --obfuscate \
            --split-debug-info=symbols/linux \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --target lib/main.dart

      - name: Package RPM
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "::error::Flutter bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r "$BUNDLE_DIR" rpmbuild/SOURCES/app
          cp "assets/logo256.png" \
            "rpmbuild/SOURCES/logo256.png"

          cat > rpmbuild/SPECS/app.spec <<EOF
          %global debug_package %{nil}

          Name:       ${{ env.PACKAGE_NAME }}
          Version:    ${{ env.APP_VERSION }}
          Release:    1%{?dist}
          Summary:    Flutter Linux application
          License:    Proprietary # TODO
          Source0:    app
          BuildArch:  ${{ matrix.rpm_arch }}

          %description
          ${{ env.APP_NAME }} packaged for Fedora ${{ matrix.arch }}

          %prep
          %setup -q -c -T

          %install
          mkdir -p %{buildroot}/usr/lib/${{ env.PACKAGE_NAME }}
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps

          cat > %{buildroot}/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop <<EOF_DESKTOP
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }} %U
          Icon=${{ env.PACKAGE_NAME }}
          Type=Application
          Categories=Utility;
          Terminal=false
          StartupNotify=true
          EOF_DESKTOP

          # Copy the binary into /usr/bin
          cp -r %{SOURCE0}/* %{buildroot}/usr/lib/${{ env.PACKAGE_NAME }}/

          ln -sf /usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }} \
            %{buildroot}/usr/bin/${{ env.APP_NAME }}

          cp %{_sourcedir}/logo256.png \
            %{buildroot}/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png

          %files
          /usr/bin/${{ env.APP_NAME }}
          %dir /usr/lib/${{ env.PACKAGE_NAME }}
          /usr/lib/${{ env.PACKAGE_NAME }}/*
          /usr/share/applications/${{ env.PACKAGE_NAME }}.desktop
          /usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png

          %changelog
          * $(date '+%a %b %d %Y') ${{ env.APP_PUBLISHER }} <soufianes.pro@gmail.com> - ${{ env.APP_VERSION }}-1
          - Automated CI build ${{ matrix.arch }}
          EOF



          rpmbuild --define "_topdir $PWD/rpmbuild" --bb "rpmbuild/SPECS/app.spec"

      - name: Smoke-test RPM
        run: |
          set -euo pipefail

          RPM_FILE=$(find \
          "rpmbuild/RPMS/${{ matrix.rpm_arch }}" \
          -maxdepth 1 \
          -name '*.rpm' \
          -print \
          -quit)

          test -n "$RPM_FILE"
          rpm -qp --info "$RPM_FILE"
          rpm -qpR "$RPM_FILE"
          dnf install -y "$RPM_FILE"

          rpm -qpl "$RPM_FILE" | grep -Fx \
              "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          rpm -qpl "$RPM_FILE" | grep -Fx \
              "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          command -v "${{ env.APP_NAME }}"

          test -L "/usr/bin/${{ env.APP_NAME }}"
          test -f "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          test -f "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          echo "✅ RPM package installed successfully"

      - name: Generate RPM checksum
        run: |
          set -euo pipefail

          RPM_FILE=$(find \
            "rpmbuild/RPMS/${{ matrix.rpm_arch }}" \
            -maxdepth 1 \
            -name '*.rpm' \
            -print \
            -quit)

          CHECKSUM_FILE="${{ env.APP_NAME }}-v${{ env.APP_VERSION }}-linux-${{ matrix.arch }}-fedora-SHA256SUMS.txt"
          sha256sum  "$RPM_FILE" > "$CHECKSUM_FILE"

          echo "CHECKSUM_FILE=$CHECKSUM_FILE" >> "$GITHUB_ENV"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: linux-rpm-${{ matrix.arch }}-${{ env.APP_VERSION }}
          path: |
            rpmbuild/RPMS/${{ matrix.rpm_arch }}/*.rpm
            ${{ env.CHECKSUM_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Clean .env
        if: always()
        run: rm -f .env
