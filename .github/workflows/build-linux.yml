name: Build Linux
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  APP_PUBLISHER: "Soufiane Saadouni"
  PACKAGE_NAME: "flutter-ci"
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_CHANNEL: "stable"
  APPIMAGETOOL_VERSION: "1.9.1"
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate required assets
        run: |
          set -euo pipefail
          test -f assets/logo.png || {
            echo "::error::assets/logo.png is required for AppImage"
            exit 1
          }

          test -f assets/logo256.png || {
            echo "::error::assets/logo256.png is required for Linux package icons"
            exit 1
          }
  build-debian-and-appimage:
    name: Debian + AppImage (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # One arch failing should not cancel the other
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            flutter_arch: x64
            deb_arch: amd64
            appimagetool: appimagetool-x86_64.AppImage
            # https://github.com/AppImage/appimagetool/releases/tag/1.9.1
            appimagetool_sha256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

          - arch: aarch64
            runner: ubuntu-24.04-arm # native ARM runner
            flutter_arch: arm64
            deb_arch: arm64
            appimagetool: appimagetool-aarch64.AppImage
            # https://github.com/AppImage/appimagetool/releases/tag/1.9.1
            appimagetool_sha256: "f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "PREFIX=${APP_NAME}-v${VERSION}-build.${BUILD}-linux-${{ matrix.arch }}" >> "$GITHUB_ENV"

          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies (C++ and GTK dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libglu1-mesa-dev \
            appstream zip wget
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: "${{ matrix.flutter_arch }}"
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-preflight-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-preflight-pub-
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings
      # - name: Run tests
      #   run: flutter test
      - name: Build Linux desktop app (${{ matrix.arch }})
        run: |
          lockfilePath="pubspec.lock"
          lockHash=""
          if [ -f "$lockfilePath" ]; then
            # Compute SHA256 and take first 12 characters
            lockHash=$(sha256sum "$lockfilePath" | awk '{print substr($1,1,12)}')
          else
            lockHash="no-lockfile"
          fi

          buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          gitCommitSha=$(git rev-parse HEAD)
          gitBranchName=${{ github.ref_name }}

          flutterVersionOutput=$(flutter --version --machine)
          flutterFwVersion=$(echo "$flutterVersionOutput" | jq -r '.frameworkVersion')
          flutterChannel=$(echo "$flutterVersionOutput" | jq -r '.channel')
          flutterVersionStr="Flutter $flutterFwVersion ($flutterChannel)"

          dartVersionStr=$(dart --version 2>&1 | head -n 1)

          flutter build linux \
            --release \
            --dart-define="BUILD_NAME=${{ env.BUILD_NAME }}" \
            --dart-define="BUILD_NUMBER=${{ env.BUILD_NUMBER }}" \
            --dart-define="FLUTTER_VERSION=$flutterVersionStr" \
            --dart-define="DART_VERSION=$dartVersionStr" \
            --dart-define="DEPENDENCY_LOCK_HASH=$lockHash" \
            --dart-define="BUILD_TIMESTAMP=$buildTimestamp" \
            --dart-define="GIT_SHA=$gitCommitSha" \
            --dart-define="GIT_BRANCH=$gitBranchName" \
            --dart-define="CI_PIPELINE_ID=${{ github.run_id }}" \
            --dart-define="BUILD_HOST=${{ runner.name }}" \
            --dart-define="OS_TARGET=${{ runner.os }}" \
            --dart-define="BUILD_TYPE=release" \
            --dart-define="BUILD_FLAVOR=production" \
            --obfuscate \
            --split-debug-info=symbols/linux \
            --build-name=${{ env.BUILD_NAME }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --target lib/main.dart
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-debug-symbols
          path: symbols/linux/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
      - name: Package Linux
        run: |
          APP_NAME="${{ env.APP_NAME }}"
          VERSION="${{ env.BUILD_NAME }}"
          ARCH="${{ matrix.flutter_arch }}"
          SOURCE="build/linux/${ARCH}/release/bundle"
          DEST="${PACKAGE_NAME}-v${VERSION}-linux-${ARCH}.tar.gz"

          if [ ! -d "$SOURCE" ]; then exit 1; fi

          # Build linux tarball
          tar -czf "$DEST" -C "$SOURCE" .

          LINUX_PACKAGE="$DEST"
          echo "LINUX_PACKAGE=$LINUX_PACKAGE" >> "$GITHUB_ENV"
      - name: Install appimagetool
        env:
          APPIMAGETOOL_FILE: ${{ matrix.appimagetool }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          set -euo pipefail

          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/${APPIMAGETOOL_FILE}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$APPIMAGETOOL_FILE" \
            "$APPIMAGETOOL_URL"

          echo "${APPIMAGETOOL_SHA256} ${APPIMAGETOOL_FILE}" | sha256sum --check

          chmod +x "$APPIMAGETOOL_FILE"

          sudo mv "$APPIMAGETOOL_FILE" /usr/local/bin/appimagetool

          appimagetool --version
      - name: Create AppImage
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "::error::Flutter bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          # Create AppDir structure
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          # Copy Icon
          cp "assets/logo.png" "$APPDIR/logo.png"
          cp "assets/logo.png" "$APPDIR/.DirIcon"

          # Create AppRun
          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${{ env.APP_NAME }}" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Create desktop entry
          cat > "$APPDIR/${{ env.APP_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Version=1.0
          Exec=${{ env.APP_NAME }} %u
          Icon=logo
          Type=Application
          Categories=Utility;
          EOF

          # ARCH is used by appimagetool to select the correct runtime
          export ARCH=${{ matrix.arch }}
          # Build AppImage
          APPIMAGE_NAME="${{ env.PACKAGE_NAME }}-v${{ env.BUILD_NAME }}-build.${{ env.BUILD_NUMBER }}-linux-${{ matrix.arch }}.AppImage"
          appimagetool --no-appstream AppDir "$APPIMAGE_NAME"
          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> "$GITHUB_ENV"
      - name: Build Debian package
        run: |
          set -euo pipefail

          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libc6-dev \
            binutils

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          PKG_DIR="${{ env.PACKAGE_NAME }}-v${{ env.BUILD_NAME }}-build.${{ env.BUILD_NUMBER }}-linux-${{ matrix.arch }}"

          # Create package structure
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}"
          mkdir -p "$PKG_DIR/usr/bin"

          mkdir -p "$PKG_DIR/usr/share/applications"

          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy full bundle to usr/lib
          cp -a "$BUNDLE_DIR"/. "$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}/"

          cp \
            "assets/logo256.png" \
            "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          # Symlink binary to usr/bin
          ln -s "/usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }}" \
            "$PKG_DIR/usr/bin/${{ env.APP_NAME }}"

          # Desktop entry
          cat > "$PKG_DIR/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop" <<EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }} %U
          Icon=${{ env.PACKAGE_NAME }}
          Type=Application
          Categories=Utility;
          Terminal=false
          StartupNotify=true
          EOF

          SHLIBS_DIR=".dpkg-shlibdeps"
          trap 'rm -rf "$SHLIBS_DIR"' EXIT
          mkdir -p "$SHLIBS_DIR/debian"

          cat > "$SHLIBS_DIR/debian/control" <<EOF
          Source: ${{ env.PACKAGE_NAME }}
          Package: ${{ env.PACKAGE_NAME }}
          Architecture: ${{ matrix.deb_arch }}
          Description: Flutter Linux application ${{ matrix.arch }}
          EOF

          APP_BINARY="$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }}"

          if [[ ! -x "$APP_BINARY" ]]; then
            echo "::error::Flutter executable not found or is not executable: $APP_BINARY"
            exit 1
          fi

          # Calculate runtime dependencies
          SHLIBS_DEPENDS="$(
            (
              cd "$SHLIBS_DIR"
              dpkg-shlibdeps \
                -O \
                -l"../$PKG_DIR/usr/lib/${{ env.PACKAGE_NAME }}" \
                -e"../$APP_BINARY"
              ) | sed -n 's/^shlibs:Depends=//p'
          )"

          if [[ -z "$SHLIBS_DEPENDS" ]]; then
            echo "::error::Could not determine Debian shared-library dependencies"
            exit 1
          fi

          echo "Detected runtime dependencies:"
          echo "$SHLIBS_DEPENDS"

          # Generate binary package metadata
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: ${{ env.PACKAGE_NAME }}
          Version: ${{ env.BUILD_NAME }}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: ${{ env.APP_PUBLISHER }} <soufianes.pro@gmail.com>
          Depends: $SHLIBS_DEPENDS
          Description: Flutter Linux application ${{ matrix.arch }}
          Section: utils
          Priority: optional
          EOF

          # Build .deb package
          dpkg-deb --build --root-owner-group "$PKG_DIR"
          echo "DEB_NAME=${PKG_DIR}.deb" >> "$GITHUB_ENV"


          # Validate resulting package
          dpkg-deb --info "${PKG_DIR}.deb"
          dpkg-deb --contents "${PKG_DIR}.deb"
      - name: Smoke-test packages
        run: |
          set -euo pipefail
          file "${{ env.APPIMAGE_NAME }}"

          dpkg-deb -c "${{ env.DEB_NAME }}" | grep -q \
            "usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          dpkg-deb -c "${{ env.DEB_NAME }}" | grep -q \
            "usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          dpkg-deb -I "${{ env.DEB_NAME }}"
          echo "✅ Packages look valid ${{ matrix.arch }}"
      - name: Smoke-test Debian package
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install \
            --yes \
            "./${{ env.DEB_NAME }}"

          command -v "${{ env.APP_NAME }}"
          test -L "/usr/bin/${{ env.APP_NAME }}"
          test -f "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          test -f "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          echo "Debian package installed successfully"
      - name: Smoke-test AppImage
        run: |
          set -euo pipefail

          file "${{ env.APPIMAGE_NAME }}"
          test -x "${{ env.APPIMAGE_NAME }}"
          "./${{ env.APPIMAGE_NAME }}" --appimage-version
          echo "✅ AppImage looks valid"
      - name: Upload Linux packages (Tarball, AppImage, DEB)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-packages
          path: |
            ${{ env.LINUX_PACKAGE }}
            ${{ env.APPIMAGE_NAME }}
            ${{ env.DEB_NAME }}
          retention-days: 30
          if-no-files-found: error
      - name: Generate build manifest
        run: |
          set -euo pipefail

          manifestDir="."
          mkdir -p "$manifestDir"
          manifestPath="$manifestDir/debian_build_manifest.json"

          lockfilePath="pubspec.lock"
          lockHash=""
          if [ -f "$lockfilePath" ]; then
            # Compute SHA256 and take first 12 characters
            lockHash=$(sha256sum "$lockfilePath" | awk '{print substr($1,1,12)}')
          else
            lockHash="no-lockfile"
          fi

          gitCommitSha=$(git rev-parse HEAD)
          gitBranchName=${{ github.ref_name }}
          buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          flutterVersionOutput=$(flutter --version --machine)
          flutterFwVersion=$(echo "$flutterVersionOutput" | jq -r '.frameworkVersion')
          flutterChannel=$(echo "$flutterVersionOutput" | jq -r '.channel')
          flutterVersionStr="Flutter $flutterFwVersion ($flutterChannel)"

          dartVersionStr=$(dart --version 2>&1 | head -n 1)

          candidateArtifacts=(
            "${{ env.LINUX_PACKAGE }}"
            "${{ env.APPIMAGE_NAME }}"
            "${{ env.DEB_NAME }}"
          )

          python3 -c '
          import json, os, hashlib, sys
          manifestPath = sys.argv[-1]
          dartVersionStr = sys.argv[-2]
          flutterVersionStr = sys.argv[-3]
          buildTimestamp = sys.argv[-4]
          gitBranchName = sys.argv[-5]
          gitCommitSha = sys.argv[-6]
          lockHash = sys.argv[-7]

          # Everything between index 1 and the last 7 items represents the candidate files
          candidates = sys.argv[1:-7]
          artifacts = {}

          for art in candidates:
            if art and os.path.exists(art):
              size = os.path.getsize(art)
              sha256_hash = hashlib.sha256()
              with open(art, "rb") as f:
                for byte_block in iter(lambda: f.read(4096), b""):
                  sha256_hash.update(byte_block)
              artifacts[art] = {
                  "type": "file",
                  "size_bytes": size,
                  "sha256": sha256_hash.hexdigest()
              }

          manifest = {
              "platform": "linux",
              "architecture": "${{ matrix.arch }}",
              "app_title": "${{ env.APP_NAME }}",
              "publisher": "${{ env.APP_PUBLISHER }}",
              "build_name": "${{ env.BUILD_NAME }}",
              "build_number": "${{ env.BUILD_NUMBER }}",
              "package_name": "${{ env.PACKAGE_NAME }}",
              "build_flavor": "production",
              "build_type": "release",
              "ci_run_id": "${{ github.run_id }}",
              "dependency_lock_hash": lockHash,
              "git_sha": gitCommitSha,
              "git_branch": gitBranchName,
              "build_timestamp": buildTimestamp,
              "flutter_version": flutterVersionStr,
              "dart_version": dartVersionStr,
              "artifacts": artifacts
          }

          with open(manifestPath, "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=2)
          ' "${candidateArtifacts[@]}" "$lockHash" "$gitCommitSha" "$gitBranchName" "$buildTimestamp" "$flutterVersionStr" "$dartVersionStr" "$manifestPath"

          echo "✅ Build manifest generated at $manifestPath"
      - name: Upload Debian build manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-deb-manifest
          path: debian_build_manifest.json
          retention-days: 30
          if-no-files-found: error
  build-RPM:
    name: Build RPM (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    container: fedora:45
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            flutter_arch: x64
            rpm_arch: x86_64

          - arch: aarch64
            runner: ubuntu-24.04-arm
            flutter_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            clang cmake ninja-build pkg-config gtk3-devel \
            gcc-c++ glib2-devel libcurl-devel openssl-devel libsecret-devel \
            libblkid-devel jsoncpp-devel libstdc++-devel libstdc++-static \
            wget unzip tar rpm-build git jq which
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: "${{ matrix.flutter_arch }}"
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.arch }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pub-
      - name: Get dependencies
        run: flutter pub get
      - name: Build Linux  (release)
        run: |
          # Workaround for Flutter bug: CMake install fails when
          # build/native_assets/linux does not exist (no native assets).
          # See https://github.com/flutter/flutter/issues/159199#issue-2675961578
          mkdir -p build/native_assets/linux

          lockfilePath="pubspec.lock"
          lockHash=""
          if [ -f "$lockfilePath" ]; then
            # Compute SHA256 and take first 12 characters
            lockHash=$(sha256sum "$lockfilePath" | awk '{print substr($1,1,12)}')
          else
            lockHash="no-lockfile"
          fi

          buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          gitCommitSha=$(git rev-parse HEAD)
          gitBranchName=${{ github.ref_name }}

          flutterVersionOutput=$(flutter --version --machine)
          flutterFwVersion=$(echo "$flutterVersionOutput" | jq -r '.frameworkVersion')
          flutterChannel=$(echo "$flutterVersionOutput" | jq -r '.channel')
          flutterVersionStr="Flutter $flutterFwVersion ($flutterChannel)"

          dartVersionStr=$(dart --version 2>&1 | head -n 1)

          flutter build linux \
            --release \
            --dart-define="BUILD_NAME=${{ env.BUILD_NAME }}" \
            --dart-define="BUILD_NUMBER=${{ env.BUILD_NUMBER }}" \
            --dart-define="FLUTTER_VERSION=$flutterVersionStr" \
            --dart-define="DART_VERSION=$dartVersionStr" \
            --dart-define="DEPENDENCY_LOCK_HASH=$lockHash" \
            --dart-define="BUILD_TIMESTAMP=$buildTimestamp" \
            --dart-define="GIT_SHA=$gitCommitSha" \
            --dart-define="GIT_BRANCH=$gitBranchName" \
            --dart-define="CI_PIPELINE_ID=${{ github.run_id }}" \
            --dart-define="BUILD_HOST=${{ runner.name }}" \
            --dart-define="OS_TARGET=${{ runner.os }}" \
            --dart-define="BUILD_TYPE=release" \
            --dart-define="BUILD_FLAVOR=production" \
            --obfuscate \
            --split-debug-info=symbols/linux \
            --build-name=${{ env.BUILD_NAME }} \
            --build-number=${{ env.BUILD_NUMBER }} \
            --target lib/main.dart
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-debug-symbols
          path: symbols/linux/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
      - name: Package RPM
        run: |
          set -euo pipefail

          BUNDLE_DIR="build/linux/${{ matrix.flutter_arch }}/release/bundle"
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            echo "::error::Flutter bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r "$BUNDLE_DIR" rpmbuild/SOURCES/app
          cp "assets/logo256.png" \
            "rpmbuild/SOURCES/logo256.png"

          cat > rpmbuild/SPECS/app.spec <<EOF
          %global debug_package %{nil}

          Name:       ${{ env.PACKAGE_NAME }}
          Version:    ${{ env.BUILD_NAME }}
          Release:    1%{?dist}
          Summary:    Flutter Linux application
          License:    Proprietary # TODO
          Source0:    app
          BuildArch:  ${{ matrix.rpm_arch }}

          %description
          ${{ env.APP_NAME }} packaged for Fedora ${{ matrix.arch }}

          %prep
          %setup -q -c -T

          %install
          mkdir -p %{buildroot}/usr/lib/${{ env.PACKAGE_NAME }}
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps

          cat > %{buildroot}/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop <<EOF_DESKTOP
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }} %U
          Icon=${{ env.PACKAGE_NAME }}
          Type=Application
          Categories=Utility;
          Terminal=false
          StartupNotify=true
          EOF_DESKTOP

          # Copy the binary into /usr/bin
          cp -r %{SOURCE0}/* %{buildroot}/usr/lib/${{ env.PACKAGE_NAME }}/

          ln -sf /usr/lib/${{ env.PACKAGE_NAME }}/${{ env.APP_NAME }} \
            %{buildroot}/usr/bin/${{ env.APP_NAME }}

          cp %{_sourcedir}/logo256.png \
            %{buildroot}/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png

          %files
          /usr/bin/${{ env.APP_NAME }}
          %dir /usr/lib/${{ env.PACKAGE_NAME }}
          /usr/lib/${{ env.PACKAGE_NAME }}/*
          /usr/share/applications/${{ env.PACKAGE_NAME }}.desktop
          /usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png

          %changelog
          * $(date '+%a %b %d %Y') ${{ env.APP_PUBLISHER }} <soufianes.pro@gmail.com> - ${{ env.BUILD_NAME }}-1
          - Automated CI build ${{ matrix.arch }}
          EOF



          rpmbuild --define "_topdir $PWD/rpmbuild" --bb "rpmbuild/SPECS/app.spec"
      - name: Smoke-test RPM
        run: |
          set -euo pipefail

          RPM_FILE=$(find \
          "rpmbuild/RPMS/${{ matrix.rpm_arch }}" \
          -maxdepth 1 \
          -name '*.rpm' \
          -print \
          -quit)

          test -n "$RPM_FILE"
          rpm -qp --info "$RPM_FILE"
          rpm -qpR "$RPM_FILE"
          dnf install -y "$RPM_FILE"

          rpm -qpl "$RPM_FILE" | grep -Fx \
              "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          rpm -qpl "$RPM_FILE" | grep -Fx \
              "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          command -v "${{ env.APP_NAME }}"

          test -L "/usr/bin/${{ env.APP_NAME }}"
          test -f "/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop"
          test -f "/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png"

          echo "✅ RPM package installed successfully"
      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-rpm
          path: |
            rpmbuild/RPMS/${{ matrix.rpm_arch }}/*.rpm
          retention-days: 30
          if-no-files-found: error
      - name: Generate rpm build manifest
        run: |
          set -euo pipefail

          manifestDir="."
          mkdir -p "$manifestDir"
          manifestPath="$manifestDir/rpm_build_manifest.json"

          lockfilePath="pubspec.lock"
          lockHash=""
          if [ -f "$lockfilePath" ]; then
            # Compute SHA256 and take first 12 characters
            lockHash=$(sha256sum "$lockfilePath" | awk '{print substr($1,1,12)}')
          else
            lockHash="no-lockfile"
          fi

          gitCommitSha=$(git rev-parse HEAD)
          gitBranchName=${{ github.ref_name }}
          buildTimestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          flutterVersionOutput=$(flutter --version --machine)
          flutterFwVersion=$(echo "$flutterVersionOutput" | jq -r '.frameworkVersion')
          flutterChannel=$(echo "$flutterVersionOutput" | jq -r '.channel')
          flutterVersionStr="Flutter $flutterFwVersion ($flutterChannel)"

          dartVersionStr=$(dart --version 2>&1 | head -n 1)

          RPM_FILE=$(find "rpmbuild/RPMS/${{ matrix.rpm_arch }}" -maxdepth 1 -name '*.rpm' -print -quit)
          candidateArtifacts=("$RPM_FILE")

          python3 -c '
          import json, os, hashlib, sys
          manifestPath = sys.argv[-1]
          dartVersionStr = sys.argv[-2]
          flutterVersionStr = sys.argv[-3]
          buildTimestamp = sys.argv[-4]
          gitBranchName = sys.argv[-5]
          gitCommitSha = sys.argv[-6]
          lockHash = sys.argv[-7]

          # Everything between index 1 and the last 7 items represents the candidate files
          candidates = sys.argv[1:-7]
          artifacts = {}

          for art in candidates:
            if art and os.path.exists(art):
              size = os.path.getsize(art)
              sha256_hash = hashlib.sha256()
              with open(art, "rb") as f:
                for byte_block in iter(lambda: f.read(4096), b""):
                  sha256_hash.update(byte_block)
              artifacts[art] = {
                  "type": "file",
                  "size_bytes": size,
                  "sha256": sha256_hash.hexdigest()
              }

          manifest = {
              "platform": "linux",
              "architecture": "${{ matrix.arch }}",
              "app_title": "${{ env.APP_NAME }}",
              "publisher": "${{ env.APP_PUBLISHER }}",
              "build_name": "${{ env.BUILD_NAME }}",
              "build_number": "${{ env.BUILD_NUMBER }}",
              "package_name": "${{ env.PACKAGE_NAME }}",
              "build_flavor": "production",
              "build_type": "release",
              "ci_run_id": "${{ github.run_id }}",
              "dependency_lock_hash": lockHash,
              "git_sha": gitCommitSha,
              "git_branch": gitBranchName,
              "build_timestamp": buildTimestamp,
              "flutter_version": flutterVersionStr,
              "dart_version": dartVersionStr,
              "artifacts": artifacts
          }

          with open(manifestPath, "w", encoding="utf-8") as f:
            json.dump(manifest, f, indent=2)
          ' "${candidateArtifacts[@]}" "$lockHash" "$gitCommitSha" "$gitBranchName" "$buildTimestamp" "$flutterVersionStr" "$dartVersionStr" "$manifestPath"

          echo "✅ RPM build manifest generated at $manifestPath"
      - name: Upload RPM build manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-rpm-manifest
          path: rpm_build_manifest.json
          retention-days: 30
          if-no-files-found: error
