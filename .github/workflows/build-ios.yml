name: iOS Build
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  pull_request:
    branches:
      - main
env:
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.6" # Stable Xcode version
  JAVA_DISTRIBUTION: "temurin"
  APP_IDENTIFIER: "dev.soufianes.flutterci"
  WORKING_DIR: "ios"
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: List available simulators and runtimes
        run: |
          echo "Available device types:"
          xcrun simctl list devicetypes
          echo "Available runtimes:"
          xcrun simctl list runtimes
          echo "Available devices:"
          xcrun simctl list devices available
      - name: Create or select iOS simulator
        run: |
          # Find the latest iOS runtime
          LATEST_IOS_RUNTIME=$(xcrun simctl list runtimes available | grep iOS | tail -1 | awk '{print $NF}' | tr -d '()')
          echo "Selected iOS runtime: $LATEST_IOS_RUNTIME"

          # Look for an existing iPhone 15 simulator with the selected runtime
          EXISTING_DEVICE=$(xcrun simctl list devices available | grep "iPhone 15" | grep "$LATEST_IOS_RUNTIME" | awk -F '[()]' '{print $2}' | head -1)

          if [ ! -z "$EXISTING_DEVICE" ]; then
            echo "Using existing iPhone 15 simulator: $EXISTING_DEVICE"
            echo "DEVICE_ID=$EXISTING_DEVICE" >> $GITHUB_ENV
          else
            echo "No existing iPhone 15 simulator found. Creating new one..."
            DEVICE_ID=$(xcrun simctl create "GitHub-Action-iPhone" "iPhone 15" "$LATEST_IOS_RUNTIME" || { echo "Failed to create simulator"; exit 1; })
            echo "Created simulator with ID: $DEVICE_ID"
            echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          fi
      - name: Boot iOS simulator
        timeout-minutes: 3
        run: |
          # Force software rendering to avoid hardware acceleration issues
          defaults write com.apple.CoreSimulator.${{ env.DEVICE_ID }} FramebufferEmulationMode -int 2 || echo "Failed to set software rendering, continuing with default"

          xcrun simctl bootstatus ${{ env.DEVICE_ID }} -b
          xcrun simctl list devices | grep Booted # Visible confirmation in the log
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Build iOS application
        env:
          APP_NAME: ${{ env.APP_NAME }}
          BUILD_NAME: ${{ env.BUILD_NAME }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          BUILD_TYPE: "debug"
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          CI_PIPELINE_ID: ${{ github.run_id }}
          BUILD_HOST: ${{ runner.name }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # TEAM_ID: ${{ secrets.TEAM_ID }}
          # APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          # APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          # FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS_FILE }}
          # FIREBASE_APP_DISTRIBUTION_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # fastlane add_plugin firebase_app_distribution
          bundle install
          bundle exec fastlane build_simulator
          # bundle exec fastlane build_debug
          # bundle exec fastlane build_firebase
          # bundle exec fastlane build_release
      - name: Upload iOS artifact (simulator build)
        uses: actions/upload-artifact@v7
        with:
          name: ios-artifacts
          path: |
            build/ios/iphonesimulator
            .fastlane/build_manifest.json
          retention-days: 60
      - name: Install iOS app on simulator
        run: |
          # Install onto the currently booted simulator
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app

          # Install onto a specific simulator by it's UDID
          # xcrun simctl install ${{ env.DEVICE_ID }} build/ios/iphonesimulator/Runner.app

          # Launch the app using the bundle ID
          # xcrun simctl launch booted ${{ env.APP_IDENTIFIER }}

          # Or xcrun simctl launch ${{ env.DEVICE_ID }} ${{ env.APP_IDENTIFIER }}

          # (Optional)
          # xcrun simctl location booted set 37.7749 -122.4194
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          ~/.maestro/bin/maestro --version
      - name: Test app using Maestro (e2e)
        run: |
          mkdir -p maestro/recordings maestro/maestro_outputs

          ~/.maestro/bin/maestro record \
            -e APP_ID=${{ env.APP_IDENTIFIER }} \
            --local maestro/flows/main.yaml maestro/recordings/app_flow.mp4

          # Collect screenshots wherever Maestro dropped them
          find . -path ./maestro -prune -o -maxdepth 3 -name '*.png' -print -exec mv {} maestro/maestro_outputs/ \;

          if [ -n "$(ls -A maestro/maestro_outputs 2>/dev/null)" ]; then
            zip -r maestro/maestro_outputs.zip maestro/maestro_outputs/
          else
            echo "No screenshots found, skipping zip"
          fi
          ls -la maestro/recordings maestro/maestro_outputs
      - name: Upload Maestro outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-maestro-outputs
          path: |
            maestro/maestro_outputs.zip
            maestro/recordings/app_flow.mp4
          if-no-files-found: warn
      - name: Shutdown simulator
        if: always() # Run even if previous steps fail
        run: |
          if [ ! -z "${{ env.DEVICE_ID }}" ]; then
            echo "Shutting down simulator..."
            xcrun simctl shutdown ${{ env.DEVICE_ID }} || echo "Simulator already shut down or shutdown failed!"
            xcrun simctl delete ${{ env.DEVICE_ID }} || echo "Simulator deletion failed!"
          else
            echo "No DEVICE_ID set, skipping shutdown and delete!"
          fi
