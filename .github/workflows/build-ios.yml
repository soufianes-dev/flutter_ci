          # Or xcrun simctl launch ${{ env.DEVICE_ID }} dev.soufianes.flutterci

          # (Optional)
          # xcrun simctl location booted set 37.7749 -122.4194

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          ~/.maestro/bin/maestro --version

      - name: Test app using Maestro (e2e)
        run: |
          mkdir -p maestro/recordings maestro/maestro_outputs

          ~/.maestro/bin/maestro record \
            -e APP_ID=dev.soufianes.flutterci \
            --local maestro/flows/main.yaml recordings/app_flow.mp4

          #Collect screenshots wherever Maestro dropped them
          find . -maxdepth 3 -name '*.png' -exec mv {} maestro/maestro_outputs/ \;
          zip -r maestro/maestro_outputs.zip maestro/maestro_outputs/
          ls -la

      - name: Upload Maestro outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-maestro-outputs
          path: maestro/maestro_outputs.zip

