name: Build Windows
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  APP_TITLE: "FlutterCI"
  APP_PUBLISHER: "Soufiane Saadouni"
  IDENTIFIER: "dev.soufianes.flutterci"
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_CHANNEL: "stable"
jobs:
  build-windows:
    name: Build MSIX + Inno Setup (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: windows-2025-vs2026 # Windows Server 2025 with Visual Studio 2026
            flutter_arch: x64
            inno_archs_allowed: x64compatible
            inno_archs_install: x64compatible
          - arch: arm64
            runs-on: windows-11-vs2026-arm # Windows 11 with Visual Studio 2026
            flutter_arch: arm64
            inno_archs_allowed: arm64
            inno_archs_install: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract metadata from pubspec.yaml
        shell: bash
        id: meta
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          # Read Project Name From pubspec.yaml
          APP_NAME=$(grep -E '^name:' pubspec.yaml | sed 's/name:[[:space:]]*//' | tr -d '\r')

          # Extract Version from pubspec.yaml
          VERSION_LINE=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          VERSION=${VERSION_LINE%%+*}
          BUILD=${VERSION_LINE##*+}
          if [[ -z "$APP_NAME" || -z "$VERSION" ]]; then
            echo "::error::Could not parse name or version from pubspec.yaml"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "PREFIX=${APP_NAME}-v${VERSION}-build.${BUILD}-windows-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            %LOCALAPPDATA%\Pub\Cache
            .dart_tool
          key: ${{ runner.os }}-${{ matrix.arch }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pub-
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings
      # - name: Verify Formatting
      #   run: dart format --output=none --set-exit-if-changed .
      # - name: Run Tests
      #   run: flutter test
      - name: Build Windows desktop app (${{ matrix.arch }})
        shell: pwsh
        run: |
          $lockfilePath = "pubspec.lock"
          $lockHash=""

          if (Test-Path $lockfilePath) {
              $lockHash = (Get-FileHash -Algorithm SHA256 -Path $lockfilePath).Hash.Substring(0,12)
          } else {
              $lockHash = "no-lockfile"
          }

          $buildTimestamp = [DateTime]::UtcNow.ToString("o")
          $gitCommitSha = git rev-parse HEAD
          $gitBranchName = "${{ github.ref_name }}"

          $flutterVersionOutput = flutter --version --machine | ConvertFrom-Json
          $flutterFwVersion     = $flutterVersionOutput.frameworkVersion
          $flutterChannel       = $flutterVersionOutput.channel
          $flutterVersionStr    = "Flutter $flutterFwVersion ($flutterChannel)"

          $dartVersionStr = ((dart --version 2>&1) -join ' ').Trim()

          flutter build windows `
            --release `
            --dart-define="IDENTIFIER=${{ env.IDENTIFIER }}" `
            --dart-define="APP_TITLE=${{ env.APP_TITLE }}" `
            --dart-define="PUBLISHER=${{ env.APP_PUBLISHER }}" `
            --dart-define="BUILD_NAME=${{ env.BUILD_NAME }}" `
            --dart-define="BUILD_NUMBER=${{ env.BUILD_NUMBER }}" `
            --dart-define="ARCHITECTURE=${{ matrix.arch }}" `
            --dart-define="COMPILER_VERSION=$flutterVersionStr" `
            --dart-define="DART_VERSION=$dartVersionStr" `
            --dart-define="DEPENDENCY_LOCK_HASH=$lockHash" `
            --dart-define="BUILD_TIMESTAMP=$buildTimestamp" `
            --dart-define="GIT_SHA=$gitCommitSha" `
            --dart-define="GIT_BRANCH=$gitBranchName" `
            --dart-define="CI_PIPELINE_ID=${{ github.run_id }}" `
            --dart-define="BUILD_HOST=${{ runner.name }}" `
            --dart-define="OS_TARGET=${{ runner.os }}" `
            --dart-define="BUILD_TYPE=release" `
            --dart-define="BUILD_FLAVOR=production" `
            --obfuscate `
            --split-debug-info=symbols/windows/${{ matrix.arch }} `
            --build-name=${{ env.BUILD_NAME }} `
            --build-number=${{ env.BUILD_NUMBER }} `
            --target lib/main.dart
      - name: Build unsigned MSIX (for Windows Store)
        shell: pwsh
        run: |
          # Guard: Ensure Publisher ID secret is present
          $publisher = "${{ secrets.WINDOWS_PUBLISHER_ID }}"
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            Write-Host "::error::WINDOWS_PUBLISHER_ID secret is missing or empty"
            exit 1
          }

          # Guard: logo must exist
          if (-not (Test-Path "assets/logo.png")){
            Write-Host "::error::assets/logo.png not found - required by msix"
            exit 1
          }

          # https://copilot.microsoft.com/shares/4kTpnqdanWqqhABTKCMrp
          # https://admin.cloud.microsoft/
          # https://myaccount.microsoft.com/
          # https://entra.microsoft.com/
          # Get Windows Publisher ID from → https://partner.microsoft.com/en-us/dashboard/account/v3/organization/identity

          # Array syntax eliminates line-continuation backtick (`) syntax errors
          $msixArgs = @(
            "run", "msix:create",
            "--architecture", "${{ matrix.flutter_arch }}",
            "--display-name", "${{ env.APP_TITLE }}",
            "--publisher", "${{ secrets.WINDOWS_PUBLISHER_ID }}",
            "--publisher-display-name", "${{ env.APP_PUBLISHER }}",
            "--identity-name", "${{ env.IDENTIFIER }}",
            "--logo-path", "assets/logo.png",
            "--capabilities", "internetClient, location, microphone, webcam",
            "--languages", "en-us",
            "--file-extension", "picture,image",
            "--protocol-activation", "http,https",
            "--execution-alias", "${{ env.APP_NAME }}",
            "--store", "true",
            "--build-windows", "false",
            "--output-name", "${{ env.PREFIX }}-unsigned",
            "--output-path", "."
          )

          dart @msixArgs

          $msixName = "${{ env.PREFIX }}-unsigned.msix"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::MSIX creation command failed"
            exit 1
          }

          if (-not (Test-Path $msixName -PathType Leaf)) {
            Write-Host "::error::Expected MSIX not found: $msixName"
            exit 1
          }

          if ((Get-Item $msixName).Length -le 0) {
            Write-Host "::error::MSIX is empty: $msixName"
            exit 1
          }

          Write-Host "✅ MSIX created: $msixName"
      - name: Upload MSIX package
        uses: actions/upload-artifact@v7
        with:
          path: "${{ env.PREFIX }}-unsigned.msix"
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PREFIX }}-debug-symbols
          path: symbols/windows/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Generate Inno Setup Script
        shell: pwsh
        run: |
          $year=(Get-Date).Year

          # Ensure VersionInfoVersion contains only numeric values (X.Y.Z.W)
          $rawVersion = "${{ env.BUILD_NAME }}"
          $cleanVersion = ($rawVersion -replace '[^0-9.]', '').Trim(".")
          if ([string]::IsNullOrWhiteSpace($cleanVersion)) { $cleanVersion = "1.0.0.0" }

          $issContent = @"
          ; Auto-generated by GitHub Actions - do not edit manually
          #define MyAppName      "${{ env.APP_TITLE }}"
          #define MyAppVersion   "${{ env.BUILD_NAME }}"
          #define MyAppPublisher "${{ env.APP_PUBLISHER }}"
          #define MyAppExeName   "${{ env.APP_NAME }}.exe"
          #define MyAppId        "{{E99ECF80-C4EF-445A-A92F-732BF4627EA0}}"

          [Setup]
          ; Generate GUID:
          ;   PowerShell: [guid]::NewGuid().ToString().ToUpper()
          ;   Bash: uuidgen
          ; NOTE: Use the exact same GUID for every future release of this app
          ; NOTE: Keep it hardcoded
          AppId={#MyAppId}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL=https://github.com/${{ github.repository }}
          AppSupportURL=https://github.com/${{ github.repository }}/issues
          VersionInfoVersion=$cleanVersion
          VersionInfoCompany={#MyAppPublisher}
          VersionInfoDescription={#MyAppName} Installer
          VersionInfoCopyright=(C) $year {#MyAppPublisher}
          DefaultDirName={autopf}\${{ env.APP_NAME }}
          DefaultGroupName={#MyAppName}
          ; Cleaner UX
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=${{ env.PREFIX }}-setup-unsigned
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=${{ matrix.inno_archs_allowed }}
          ArchitecturesInstallIn64BitMode=${{ matrix.inno_archs_install }}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          ; Closes running app before upgrade
          CloseApplications=yes
          RestartApplications=no
          ; Uncomment for silent installs (winget, choco friendly)
          ; SilentInstall=1

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Files]
          Source: "build\windows\${{ matrix.arch }}\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          ; Launch the main application executable after setup finishes
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content -Path "windows_installer.iss" -Value $issContent -Encoding UTF8
          Write-Host "✅ windows_installer.iss generated successfully."
      - name: Build Inno setup installer
        run: |
          ISCC.exe "windows_installer.iss"
      - name: Verify installer
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER="${{ env.PREFIX }}-setup-unsigned.exe"
          if [ ! -s "$INSTALLER" ]; then
            echo "::error:: Installer missing or empty!"
            exit 1
          fi
          file "$INSTALLER" || true
          echo "✅ Installer verified"
      - name: Upload Inno Installer
        uses: actions/upload-artifact@v7
        with:
          path: "${{ env.PREFIX }}-setup-unsigned.exe"
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "${env:ProgramFiles}\NSIS",
            "C:\ProgramData\chocolatey\bin"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              echo $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added to PATH: $p"
            }
          }
      - name: Generate NSIS script
        shell: pwsh
        run: |
          $nsiContent = @'
          ; Auto-generated by GitHub Actions - do not edit manually

          !include "MUI2.nsh"
          !include "x64.nsh"

          !define APPNAME "${{ env.APP_NAME }}"
          !define VERSION "${{ env.BUILD_NAME }}"
          !define BUILD_NUMBER "${{ env.BUILD_NUMBER }}"
          !define COMPANY "${{ env.APP_PUBLISHER }}"
          !define ARCH    "${{ matrix.arch }}"

          Name "${APPNAME}"
          OutFile "${{ env.PREFIX }}-installer-unsigned.exe"
          InstallDir "$PROGRAMFILES64\${APPNAME}"
          RequestExecutionLevel admin
          Unicode True

          ; ----- Modern UI settings -----
          !define MUI_ICON "${NSISDIR}\Contrib\Graphics\Icons\modern-install.ico"
          !define MUI_UNICON "${NSISDIR}\Contrib\Graphics\Icons\modern-uninstall.ico"

          ; Optional: custom header/welcome bitmaps (place files in repo)
          ; !define MUI_HEADERIMAGE
          ; !define MUI_HEADERIMAGE_BITMAP "assets\nsis-header.bmp"
          ; !define MUI_WELCOMEFINISHPAGE_BITMAP "assets\nsis-wizard.bmp"

          ; ----- Pages -----
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          ; ----- Language -----
          !insertmacro MUI_LANGUAGE "English"

          ; ----- Install section -----
          Section "Install"
            SetRegView 64
            SetOutPath "$INSTDIR"
            File /r "build\windows\${{ matrix.arch }}\runner\Release\*.*"

            ; Create Menu Shortcut
            CreateDirectory "$SMPROGRAMS\${APPNAME}"
            CreateShortcut "$SMPROGRAMS\${APPNAME}\${APPNAME}.lnk" "$INSTDIR\${APPNAME}.exe"

            ; Desktop shortcut
            CreateShortcut "$DESKTOP\${APPNAME}.lnk" "$INSTDIR\${APPNAME}.exe"

            ; Uninstaller
            WriteUninstaller "$INSTDIR\Uninstall.exe"

            ; Add/remove Programs entry
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" \
              "DisplayName" "${APPNAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" \
              "UninstallString" '"$INSTDIR\Uninstall.exe"'
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" \
              "DisplayVersion" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" \
              "Publisher" "${COMPANY}"
          SectionEnd

          ; ----- Uninstall section -----
          Section "Uninstall"
          SetRegView 64
            Delete "$INSTDIR\Uninstall.exe"
            RMDir /r "$INSTDIR"
            Delete "$DESKTOP\${APPNAME}.lnk"
            RMDir /r "$SMPROGRAMS\${APPNAME}"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}"
          SectionEnd
          '@

          Set-Content -Path "installer.nsi" -Value $nsiContent -Encoding UTF8
          Write-Host "✅ Modern UI installer.nsi generated successfully."
      # Compile NSIS installer
      - name: Package with NSIS
        run: makensis installer.nsi
      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v7
        with:
          path: "${{ env.PREFIX }}-installer-unsigned.exe"
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
      - name: Package Windows (Portable ZIP)
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/${{ matrix.arch }}/runner/Release"
          $ZipName = "${{ env.PREFIX }}-portable-unsigned.zip"
          $DestPath = Join-Path (Get-Location) $ZipName

          if (-Not (Test-Path $ReleaseDir -PathType Container)) {
            Write-Host "::error::Windows release directory not found: $ReleaseDir"
            exit 1
          }

          $Files = @(Get-ChildItem -Path $ReleaseDir -Force)

          if ($Files.Count -eq 0) {
            Write-Host "::error::Windows release directory is empty: $ReleaseDir"
            exit 1
          }

          # Switch context into the release directory so 7-Zip compresses files from the root
          Push-Location $ReleaseDir
          try {
            & 7z a -tzip -mx=9 "$DestPath" "*"
          } finally {
            Pop-Location
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::7-Zip failed to create package"
            exit 1
          }


          if (-not (Test-Path $ZipName -PathType Leaf)) {
            Write-Host "::error::ZIP package was not created: $ZipName"
            exit 1
          }

          Write-Host "Portable ZIP created successfully: $ZipName"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PREFIX }}-portable-unsigned.zip
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Generate build manifest
        shell: pwsh
        run: |
          $manifestDir = "."
          if (-not (Test-Path $manifestDir)) {
            New-item -ItemType Directory -Path $manifestDir | Out-Null
          }
          $manifestPath = Join-Path $manifestDir "windows_build_manifest.json"

          $lockfilePath = "pubspec.lock"
          $lockHash = ""
          if (Test-Path $lockfilePath) {
              $lockHash = (Get-FileHash -Algorithm SHA256 -Path $lockfilePath).Hash.Substring(0,12)
          } else {
              $lockHash = "no-lockfile"
          }

          $gitCommitSha = git rev-parse HEAD
          $gitBranchName = "${{ github.ref_name }}"
          $buildTimestamp = [DateTime]::UtcNow.ToString("o")

          # Extract Flutter and Dart versions programmatically
          $flutterVersionOutput = flutter --version --machine | ConvertFrom-Json
          $flutterVersionStr = "Flutter $($flutterVersionOutput.frameworkVersion) ($($flutterVersionOutput.channel))"
          $dartVersionStr = ((dart --version 2>&1) -join ' ').Trim()

          $artifactsObj = [ordered]@{}

          # Collect generated Windows artifacts if they exist
          $candidateArtifacts = @(
            "${{ env.PREFIX }}-unsigned.msix",
            "${{ env.PREFIX }}-setup-unsigned.exe",
            "${{ env.PREFIX }}-installer-unsigned.exe",
            "${{ env.PREFIX }}-portable-unsigned.zip"
          )

          foreach ($art in $candidateArtifacts) {
            if (Test-Path $art) {
              $fileItem = Get-Item $art
              $sha256Hash = (Get-FileHash -Algorithm SHA256 -Path $art).Hash.ToLower()
              $artifactsObj[$art] = [ordered]@{
                "type"       = "file"
                "size_bytes" = $fileItem.Length
                "sha256"     = $sha256Hash
              }
            }
          }

          $manifest = [ordered]@{
            "platform"             = "windows"
            "architecture"         = "${{ matrix.arch }}"
            "app_title"            = "${{ env.APP_TITLE }}"
            "publisher"            = "${{ env.APP_PUBLISHER }}"
            "build_name"           = "${{ env.BUILD_NAME }}"
            "build_number"         = "${{ env.BUILD_NUMBER }}"
            "package_name"         = "${{ env.IDENTIFIER }}"
            "build_flavor"         = "production"
            "build_type"           = "release"
            "ci_run_id"            = "${{ github.run_id }}"
            "dependency_lock_hash" = "$lockHash"
            "git_sha"              = "$gitCommitSha"
            "git_branch"           = "$gitBranchName"
            "build_timestamp"      = "$buildTimestamp"
            "flutter_version"      = "$flutterVersionStr"
            "dart_version"         = "$dartVersionStr"
            "artifacts"            = $artifactsObj
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding utf8
          Write-Host "✅ Build manifest generated at $manifestPath"
      - name: Upload Windows build manifest
        uses: actions/upload-artifact@v7
        with:
          path: windows_build_manifest.json
          archive: false
          retention-days: 30
          if-no-files-found: error

