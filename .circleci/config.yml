version: 2.1

# Use community orbs for better integration
orbs:
  flutter: circleci/flutter@3.0.0

parameters:
  flutter_version:
    type: string
    default: "3.47.2"
  xcode_version:
    type: string
    default: "26.4.0" # CircleCI uses full version format

jobs:
  flutter-ios-setup:
    macos:
      # This automatically sets Xcode
      xcode: << pipeline.parameters.xcode_version >>

    steps:
      - checkout

      # Xcode is already set by the executor, but verify
      - run:
          name: Select Xcode version
          command: |
            xcodebuild -version
            xcode-select -p

      - flutter/install_sdk_and_pub:
          channel: stable
          version: << pipeline.parameters.flutter_version >>

      - restore_cache:
          keys:
            - flutter-pub-cache-{{ checksum "pubspec.yaml" }}
            - cocoapods-cache-{{ checksum "ios/Podfile.lock" }}

      - run:
          name: Install CocoaPods and dependencies
          command: |
            flutter pub get
            (cd ios && pod install --repo-update)

      - save_cache:
          paths:
            - ~/.pub-cache
          key: flutter-pub-cache-{{ checksum "pubspec.yaml" }}

      - save_cache:
          paths:
            - ios/Pods
          key: cocoapods-cache-{{ checksum "ios/fPodfile.lock" }}

      - run:
          name: Setup iOS project with Ruby script
          command: |
            gem install xcodeproj
            gem install plist
            ruby ios/setup.rb
            # Confirm injection worked (optional but smart)
            grep -E 'PrivacyInfo|GoogleService' ios/Runner.xcodeproj/project.pbxproj || {
              echo "❌ Resource injection failed!"; exit 1;
            }

      - run:
          name: Archive for inspection
          command: zip -r ios.zip ios/

      - store_artifacts:
          path: ios.zip
          destination: ios-setup-artifact
  flutter-ios-build:
    macos:
      # This automatically sets Xcode
      xcode: << pipeline.parameters.xcode_version >>

    environment:
      FLUTTER_VERSION: << pipeline.parameters.flutter_version >>

    steps:
      - checkout

      - flutter/install_sdk_and_pub:
          channel: stable
          version: << pipeline.parameters.flutter_version >>

      - restore_cache:
          keys:
            - flutter-pub-cache-{{ checksum "pubspec.yaml" }}
            - cocoapods-cache-{{ checksum "ios/Podfile.lock" }}

      - run:
          name: Install CocoaPods and dependencies
          command: |
            flutter pub get
            (cd ios && pod install --repo-update)

      - save_cache:
          paths:
            - ~/.pub-cache
          key: flutter-pub-cache-{{ checksum "pubspec.yaml" }}

      - save_cache:
          paths:
            - ios/Pods
          key: cocoapods-cache-{{ checksum "ios/Podfile.lock" }}

